version: "3.9"

services:
  user-service:
    image: radhesh12/user-service:latest
    container_name: user-service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - chat-network

  chat-service:
    image: radhesh12/chat-service:latest
    container_name: chat-service
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
    networks:
      - chat-network

  mail-service:
    image: radhesh12/mail-service:latest
    container_name: mail-service
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge
